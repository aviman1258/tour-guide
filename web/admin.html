<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Deodapper · Admin</title>
  <link rel="icon" type="image/svg+xml" href="img/deodap.svg" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    body { padding: 0 0 40px; }
    .admin { max-width: 1100px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
    .stat .n { font-size: 26px; font-weight: 800; }
    .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
    .card h2 { display: flex; justify-content: space-between; align-items: baseline; }
    .card h2 small { color: var(--muted); font-weight: 400; }
    .scroll { overflow-x: auto; }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 90px; padding-top: 6px; }
    .bars .bar { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
    .bars .bar span { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--muted); white-space: nowrap; }
    .days { display: flex; gap: 6px; }
    .days .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .kind-page { color: var(--muted); }
    .kind-plan, .kind-prepare, .kind-publish { color: var(--ok); font-weight: 600; }
    .kind-plan_error, .kind-prepare_error { color: var(--late); font-weight: 600; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" title="Deodapper home">
      <img class="brand-logo" src="img/deodap.svg" alt="" width="44" height="44" />
      <span class="brand-text"><h1>Usage</h1><span class="brand-sub">admin · no personal data beyond IP and rough location</span></span>
    </a>
    <div class="days" id="days">
      <button type="button" class="btn btn-sm" data-days="1">Today</button>
      <button type="button" class="btn btn-sm" data-days="7">7 days</button>
      <button type="button" class="btn btn-sm" data-days="30" aria-pressed="true">30 days</button>
      <button type="button" class="btn btn-sm" data-days="90">90 days</button>
    </div>
    <nav><button type="button" id="refresh" class="btn btn-ghost">Refresh</button> <button type="button" id="logout" class="btn btn-ghost" title="Forget the admin password on this browser">Lock</button></nav>
  </header>

  <main class="admin">
    <div id="msg" class="msg" hidden></div>
    <div class="cards" id="cards"></div>

    <section class="card">
      <h2>Visitors per day <small id="range"></small></h2>
      <div class="bars" id="bars"></div>
    </section>

    <div class="grid2">
      <section class="card"><h2>Where from <small>by unique visitors</small></h2><div class="scroll"><table id="places"></table></div></section>
      <section class="card"><h2>Devices</h2><div class="scroll"><table id="devices"></table></div></section>
      <section class="card"><h2>Pages</h2><div class="scroll"><table id="pages"></table></div></section>
      <section class="card"><h2>What they did</h2><div class="scroll"><table id="kinds"></table></div></section>
    </div>

    <section class="card"><h2>Most active addresses</h2><div class="scroll"><table id="visitors"></table></div></section>
    <section class="card"><h2>Recent events <small>newest first · last 200</small></h2><div class="scroll"><table id="events"></table></div></section>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
